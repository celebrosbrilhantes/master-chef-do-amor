<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Master Chef do Amor</title>
<style>
  :root{
    --bg-deep: #3a1212;
    --bg-deep-2: #5a1c1c;
    --wine: #8c2f2f;
    --wine-2: #a83a3a;
    --gold: #d99a3f;
    --gold-2: #e8b35e;
    --cream: #fff8ef;
    --cream-2: #fbecd8;
    --ink: #3a1212;
    --ink-soft: #7a5a4a;
    --line: #ecd6b8;
    font-size: 18px;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: 'Avenir Next', 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg-deep);
    color: var(--ink);
    overscroll-behavior: none;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh; /* dvh = dynamic viewport height, considera barras do navegador mobile */
    max-width: 600px;
    margin: 0 auto;
    background: var(--cream);
    position: relative;
    box-shadow: 0 0 60px rgba(0,0,0,0.45);
  }

  /* ---------- HEADER ---------- */
  header {
    background: linear-gradient(135deg, var(--bg-deep-2), var(--bg-deep));
    color: var(--cream);
    padding: 20px 18px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
  }
  header::after{
    content:"";
    position:absolute; right:-30px; top:-40px;
    width:160px; height:160px;
    background: radial-gradient(circle, rgba(217,154,63,0.35), transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  .chef-icon {
    width: 54px; height: 54px;
    border-radius: 50%;
    background: var(--gold);
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
    flex-shrink: 0;
    box-shadow: 0 3px 12px rgba(0,0,0,0.35);
    overflow: hidden;
  }
  .chef-icon img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .header-text h1 {
    margin: 0; font-size: 21px; font-weight: 800; letter-spacing: 0.2px;
    line-height: 1.2;
  }
  .header-text p {
    margin: 4px 0 0; font-size: 14px; color: #f0d9b8; font-weight: 400;
  }
  .gear-btn{
    margin-left:auto;
    background: rgba(255,255,255,0.10);
    border: 1px solid rgba(255,255,255,0.22);
    color: var(--cream);
    width: 44px; height: 44px; border-radius: 12px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:20px;
    flex-shrink: 0;
    position: relative;
    z-index: 5;
  }
  .gear-btn:active{ background: rgba(255,255,255,0.22); }

  /* ---------- CHAT ---------- */
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    background:
      radial-gradient(circle at 10% 15%, rgba(140,47,47,0.05), transparent 35%),
      radial-gradient(circle at 90% 85%, rgba(217,154,63,0.08), transparent 40%),
      var(--cream);
  }

  /* ---------- WELCOME / QUICK ACTIONS ---------- */
  #welcomeBlock {
    text-align: center;
    padding: 6px 4px 4px;
  }
  #welcomeBlock h2 {
    font-size: 20px;
    margin: 0 0 6px;
    color: var(--wine);
    font-weight: 800;
  }
  #welcomeBlock p {
    font-size: 16px;
    color: var(--ink-soft);
    margin: 0 0 16px;
    line-height: 1.4;
  }

  .quick-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 8px;
  }
  .quick-btn {
    background: var(--cream-2);
    border: 2px solid var(--line);
    border-radius: 18px;
    padding: 18px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    transition: transform 0.12s, background 0.15s, border-color 0.15s;
    text-align: center;
  }
  .quick-btn:active { transform: scale(0.96); background: #f7e2c4; }
  .quick-btn .qicon { font-size: 34px; line-height: 1; }
  .quick-btn .qlabel {
    font-size: 16px;
    font-weight: 700;
    color: var(--wine);
    line-height: 1.25;
  }
  .quick-btn.featured {
    grid-column: span 2;
    flex-direction: row;
    justify-content: center;
    background: linear-gradient(135deg, var(--gold-2), var(--gold));
    border-color: var(--gold);
  }
  .quick-btn.featured .qlabel { color: var(--bg-deep); }
  .quick-btn.featured .qicon { font-size: 30px; }

  .inline-catalog {
    background: var(--cream-2);
    border: 2px dashed var(--gold);
    border-radius: 18px;
    padding: 14px 14px 4px;
    margin: 2px 0;
  }
  .inline-catalog-label {
    font-size: 16px;
    font-weight: 700;
    color: var(--wine);
    margin-bottom: 10px;
  }

  .recipe-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 10px;
  }
  .recipe-item {
    background: var(--cream);
    border: 2px solid var(--line);
    border-radius: 12px;
    padding: 13px 16px;
    font-size: 16.5px;
    font-weight: 600;
    color: var(--ink);
    text-align: left;
    cursor: pointer;
    transition: background 0.12s, transform 0.1s;
  }
  .recipe-item:active { transform: scale(0.98); background: #f7e2c4; }
  .recipe-item::before {
    content: "🍽 ";
  }
  .recipe-back-btn {
    background: none;
    border: none;
    color: var(--wine);
    font-size: 15px;
    font-weight: 700;
    padding: 8px 4px 10px;
    cursor: pointer;
  }

  .msg-row { display: flex; gap: 12px; max-width: 100%; }
  .msg-row.user { justify-content: flex-end; }

  .avatar {
    width: 38px; height: 38px; border-radius: 50%;
    background: var(--gold);
    flex-shrink: 0;
    display:flex; align-items:center; justify-content:center;
    font-size: 19px;
    margin-top: 2px;
    overflow: hidden;
  }
  .avatar img {
    width: 100%; height: 100%; object-fit: cover; object-position: top center;
  }

  .bubble {
    padding: 14px 16px;
    border-radius: 18px;
    line-height: 1.55;
    font-size: 17.5px;
    max-width: 80%;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg-row.assistant .bubble {
    background: var(--cream-2);
    border: 2px solid var(--line);
    border-top-left-radius: 5px;
    color: var(--ink);
  }
  .msg-row.user .bubble {
    background: var(--wine);
    color: white;
    border-top-right-radius: 5px;
  }
  .bubble img.attached {
    max-width: 100%;
    border-radius: 12px;
    margin-top: 8px;
    display: block;
  }

  .typing-dots {
    display: flex; gap: 5px; padding: 8px 4px;
  }
  .typing-dots span {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--ink-soft);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2){ animation-delay: 0.15s; }
  .typing-dots span:nth-child(3){ animation-delay: 0.3s; }
  @keyframes bounce { 0%,80%,100%{ transform: translateY(0); opacity:0.4;} 40%{ transform: translateY(-4px); opacity:1;} }

  /* timer card inline */
  .timer-card{
    margin-top: 10px;
    background: var(--bg-deep);
    color: var(--cream);
    border-radius: 14px;
    padding: 14px 16px;
    display:flex; align-items:center; gap:12px;
    font-size: 16px;
  }
  .timer-card .tnum{
    font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums;
    color: var(--gold-2);
    min-width: 66px;
  }
  .timer-card button{
    margin-left:auto;
    background: var(--gold);
    border:none; color: var(--bg-deep);
    padding: 9px 16px; border-radius: 10px;
    font-size: 15px; font-weight: 700; cursor:pointer;
  }
  .timer-card button:disabled{ opacity:0.5; }

  /* ---------- ATTACH PREVIEW ---------- */
  #preview-bar {
    display: none;
    padding: 12px 16px 0;
    flex-shrink: 0;
    background: var(--cream);
  }
  #preview-bar.show { display: flex; align-items:center; gap: 12px; }
  #preview-bar img { width: 60px; height: 60px; object-fit: cover; border-radius: 12px; border: 2px solid var(--line); }
  #preview-bar .pv-info{ font-size: 15px; color: var(--ink-soft); flex:1; }
  #preview-bar .pv-remove{
    background: none; border: none; font-size: 22px; color: var(--ink-soft); cursor: pointer;
    padding: 6px;
  }

  /* ---------- INPUT BAR ---------- */
  #inputbar {
    display: flex;
    align-items: flex-end;
    gap: 6px;
    padding: 10px 8px;
    background: var(--cream);
    border-top: 2px solid var(--line);
    flex-shrink: 0;
  }
  .icon-btn {
    width: 44px; height: 44px;
    border-radius: 50%;
    border: none;
    background: var(--cream-2);
    color: var(--ink);
    font-size: 19px;
    flex-shrink: 0;
    display:flex; align-items:center; justify-content:center;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    border: 2px solid var(--line);
  }
  .icon-btn:active{ transform: scale(0.93); }
  .icon-btn.recording {
    background: var(--wine);
    color: white;
    border-color: var(--wine);
    animation: pulse 1s infinite;
  }
  @keyframes pulse { 0%,100%{ box-shadow: 0 0 0 0 rgba(140,47,47,0.5);} 50%{ box-shadow: 0 0 0 10px rgba(140,47,47,0);} }

  #textInput {
    flex: 1;
    border: 2px solid var(--line);
    background: white;
    border-radius: 24px;
    padding: 13px 18px;
    font-size: 17.5px;
    resize: none;
    max-height: 110px;
    font-family: inherit;
    line-height: 1.4;
  }
  #textInput:focus { outline: none; border-color: var(--gold); }

  #sendBtn {
    width: 50px; height: 50px;
    border-radius: 50%;
    border: none;
    background: var(--wine);
    color: white;
    font-size: 20px;
    flex-shrink: 0;
    cursor: pointer;
    display:flex; align-items:center; justify-content:center;
  }
  #sendBtn:disabled { opacity: 0.4; }

  /* ---------- SETTINGS MODAL ---------- */
  #settingsModal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    display: none;
    align-items: center; justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  #settingsModal.show { display: flex; }
  .modal-box {
    background: var(--cream);
    border-radius: 20px;
    padding: 26px;
    max-width: 440px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
  }
  .modal-box h2 { margin: 0 0 6px; font-size: 21px; color: var(--wine); }
  .modal-box p.hint { font-size: 15px; color: var(--ink-soft); margin: 0 0 18px; line-height: 1.4; }
  .modal-box label { font-size: 16px; font-weight: 700; display:block; margin-bottom: 8px; margin-top: 16px; }
  .modal-box input[type=password], .modal-box input[type=text] {
    width: 100%; padding: 13px 14px; border-radius: 12px;
    border: 2px solid var(--line); font-size: 16px;
  }
  .modal-box .row-btns { display:flex; gap:12px; margin-top: 22px; }
  .modal-box button.primary {
    flex:1; background: var(--wine); color:white; border:none;
    padding: 14px; border-radius: 12px; font-size: 16px; font-weight:700; cursor:pointer;
  }
  .modal-box button.secondary {
    background: none; border: 2px solid var(--line); color: var(--ink);
    padding: 14px 18px; border-radius: 12px; font-size: 16px; cursor:pointer;
  }
  .status-dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:8px; }
  .status-dot.ok { background: #5c8a4f; }
  .status-dot.off { background: var(--wine); }

  input[type=file] { display: none; }

  /* scrollbar */
  #chat::-webkit-scrollbar{ width:6px; }
  #chat::-webkit-scrollbar-thumb{ background: var(--line); border-radius: 4px; }

  /* ---------- CRÉDITOS ---------- */
  .aviso-credito {
    background: linear-gradient(135deg, #fff3cd, #ffeaa7);
    border: 2px solid var(--gold);
    border-radius: 16px;
    padding: 14px 16px;
    font-size: 16px;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 4px 0;
  }
  .aviso-credito span { flex: 1; }
  .aviso-credito a {
    background: var(--wine);
    color: white;
    padding: 8px 14px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    text-decoration: none;
    white-space: nowrap;
  }

  .bloqueio-credito {
    text-align: center;
    padding: 28px 20px;
    background: var(--cream-2);
    border: 2px solid var(--line);
    border-radius: 18px;
    margin: 10px 0;
  }
  .bloqueio-credito .bloqueio-icon { font-size: 44px; margin-bottom: 10px; }
  .bloqueio-credito h3 { font-size: 20px; color: var(--wine); margin: 0 0 8px; }
  .bloqueio-credito p { font-size: 16px; color: var(--ink-soft); margin: 0 0 18px; line-height: 1.4; }
  .bloqueio-credito a {
    display: inline-block;
    background: var(--wine);
    color: white;
    padding: 14px 28px;
    border-radius: 14px;
    font-size: 17px;
    font-weight: 700;
    text-decoration: none;
  }

  .saldo-badge {
    font-size: 13px;
    color: var(--ink-soft);
    text-align: right;
    padding: 2px 16px 4px;
    flex-shrink: 0;
    background: var(--cream);
  }
</style>
</head>

const SYSTEM_PROMPT = `Você é o Master Chef do Amor, um chef camarada e caloroso que ajuda pessoas a cozinharem com mais facilidade, economia e prazer no dia a dia. Você não é um chef de competição, técnico ou intimidador — você é o tipo de amigo que sabe cozinhar bem e adora compartilhar isso, sem nunca fazer ninguém se sentir incapaz ou julgado.

Sua missão não é só ensinar receitas. É tornar a rotina de quem cozinha em casa mais leve, divertida e especial. Para você, a mesa é família, e família é amor.

IMPORTANTE — seu público inclui muitas pessoas mais velhas. Escreva frases curtas, parágrafos curtos, evite termos técnicos sem explicar, e seja bem claro e direto nas instruções de receita (passo a passo numerado quando fizer sentido).

TOM DE VOZ:
- Caloroso e brincalhão, nunca sério ou técnico demais. Linguagem simples e próxima.
- Entusiasmo genuíno quando o cliente conta o que vai cozinhar.
- Insira curiosidades e dicas de chef naturalmente, sem virar aula.
- Ao final de receitas básicas, ofereça um "upgrade" opcional.
- Quando o cliente voltar contando como o prato ficou, comemore com ele.
- Nunca julgue: se o cliente quiser pedir pizza ou comida pronta, valide isso sem reservas.

NA PRIMEIRA CONVERSA: procure descobrir, de forma natural (não como formulário), quantas pessoas moram na casa e os nomes de cada uma. Use isso depois para personalizar (ex: "café do rei e da rainha" para o casal, brincadeiras com nome dos filhos). Se a pessoa não quiser compartilhar, siga sem insistir.

CRONÔMETRO: sempre que uma receita tiver uma etapa com tempo definido (ex: "deixe ferver por 10 minutos"), ofereça proativamente o cronômetro. Para isso, inclua no final da sua mensagem uma linha exatamente neste formato (o sistema vai detectar e criar o timer automaticamente):
[TIMER: <segundos> | <rótulo curto>]
Exemplo: [TIMER: 600 | Ferver o macarrão]
Pode incluir mais de uma linha [TIMER: ...] se a receita tiver mais de uma etapa cronometrada. Continue escrevendo normalmente o resto da receita ao redor dessas linhas.

CATEGORIAS RÁPIDAS: quando o cliente disser que quer "massas", "carnes", "doces e sobremesas", "comida do dia a dia", ou pedir uma "receita afetiva/especial", entenda isso como ponto de partida da conversa — pergunte com entusiasmo o que a pessoa tem em casa ou prefere, e siga a partir daí.

CATÁLOGO DE IDEIAS: de vez em quando — não toda hora, sem exagerar, mas sempre que parecer uma boa oportunidade (por exemplo: quando a conversa estiver meio parada, quando o cliente disser que não sabe o que cozinhar, no início de uma nova conversa depois de alguns dias, ou depois de terminar uma receita) — ofereça mandar o catálogo de ideias. Pergunte de um jeito natural e caloroso, por exemplo: "quer que eu te mande um cardápio de ideias pra você escolher, ou prefere só ir conversando comigo?". 
Se o cliente disser que sim, que quer ver o catálogo, inclua no final da sua mensagem, em uma linha separada, exatamente este marcador (o sistema vai detectar e mostrar os botões automaticamente):
[CATALOGO]
Só use esse marcador depois que o cliente confirmar que quer ver as opções — nunca encha a tela de botões sem a pessoa pedir ou aceitar.

MUITO IMPORTANTE: se a mensagem do cliente já vier no formato "Quero aprender a fazer: [nome da receita]. Pode me ensinar passo a passo?", isso significa que ela JÁ escolheu a receita tocando num botão do catálogo. Nesse caso, NUNCA pergunte se ela quer ver o catálogo de novo, e NUNCA use o marcador [CATALOGO] nessa resposta — vá direto ensinar a receita escolhida, com entusiasmo, passo a passo.

FUNCIONALIDADES:
- Foto da geladeira/despensa: identifique ingredientes e sugira o que fazer com eles, mais dicas de organização e validade.
- Orientação de armazenamento e higienização de alimentos, de forma prática.
- Sugestões de café da manhã, almoço e janta adaptadas ao gosto da pessoa.
- Educação financeira aplicada à comida: ajude a planejar compras dentro do orçamento, evitando desperdício.
- Adapte sugestões à faixa de renda da pessoa, sem assumir orçamento alto como padrão.

REGRAS DE NUTRIÇÃO (OBRIGATÓRIAS, SEM EXCEÇÃO):
- Pode dar noções básicas e práticas (gorduras boas/ruins, fibras, trocas simples e baratas).
- NUNCA prometa cura, tratamento ou benefício médico de nenhum alimento.
- NUNCA dê orientação nutricional personalizada para condições de saúde específicas (diabetes, hipertensão, gravidez de risco, etc.) — oriente buscar nutricionista ou médico.
- NUNCA sugira dietas restritivas, planos de perda de peso, contagem de calorias ou metas numéricas de peso.
- Se notar sinais de preocupação excessiva com peso ou culpa em relação à comida, não reforce isso — mantenha tom leve e normalize a alimentação prazerosa.
- Sempre que a situação exigir mais que orientação geral, diga claramente que um profissional de saúde é o caminho certo, sem alarmismo.

Você não substitui um nutricionista ou médico. Cada interação deve deixar a pessoa se sentindo mais capaz e mais leve, nunca mais pressionada.`;

function renderWelcomeBlock(){
  const block = document.createElement('div');
  block.id = 'welcomeBlock';

  const h2 = document.createElement('h2');
  h2.textContent = 'Oi! O que vamos cozinhar hoje?';
  const p = document.createElement('p');
  p.textContent = 'Toque em uma opção, ou escreva o que quiser ali embaixo.';

  block.appendChild(h2);
  block.appendChild(p);
  block.appendChild(buildCatalogGrid());

  chatEl.appendChild(block);
}

/* Checks if email and API key are configured. If not, opens settings modal
   and returns false so the calling code can abort the action. */
function exigeConfiguracao(acaoAposSalvar){
  if(!alunoEmail){
    document.getElementById('modalTitle').textContent = '👋 Antes de começar...';
    document.getElementById('modalHint').textContent = 'Pra eu salvar seus créditos, preciso só do seu e-mail.';
    acaoPendente = acaoAposSalvar || null;
    settingsModal.classList.add('show');
    return true; // configuração está faltando
  }
  return false;
}

function buildCatalogGrid(onCategoryClick){
  const grid = document.createElement('div');
  grid.className = 'quick-grid';

  CATEGORIES.forEach(cat => {
    const btn = document.createElement('div');
    btn.className = 'quick-btn' + (cat.featured ? ' featured' : '');
    const icon = document.createElement('div');
    icon.className = 'qicon';
    icon.textContent = cat.icon;
    const label = document.createElement('div');
    label.className = 'qlabel';
    label.textContent = cat.label;
    btn.appendChild(icon);
    btn.appendChild(label);
    btn.onclick = () => {
      const continuar = () => {
        if(onCategoryClick){
          onCategoryClick(cat);
        } else {
          // Comportamento padrão: substitui o welcomeBlock inteiro pela lista de receitas
          removeWelcomeBlock();
          const recipeGrid = buildRecipeGrid(cat);
          chatEl.appendChild(recipeGrid);
          scrollToBottom();
        }
      };
      if(exigeConfiguracao(continuar)) return;
      continuar();
    };
    grid.appendChild(btn);
  });

  return grid;
}

function buildRecipeGrid(category){
  const wrap = document.createElement('div');
  wrap.className = 'inline-catalog';

  const label = document.createElement('div');
  label.className = 'inline-catalog-label';
  label.textContent = `${category.icon} ${category.label} — escolha uma receita:`;
  wrap.appendChild(label);

  const list = document.createElement('div');
  list.className = 'recipe-list';

  category.recipes.forEach(recipeName => {
    const item = document.createElement('button');
    item.className = 'recipe-item';
    item.textContent = recipeName;
    item.onclick = () => {
      const continuar = () => {
        textInput.value = recipePrompt(category.label, recipeName);
        sendMessage();
      };
      if(exigeConfiguracao(continuar)) return;
      continuar();
    };
    list.appendChild(item);
  });

  wrap.appendChild(list);

  const backBtn = document.createElement('button');
  backBtn.className = 'recipe-back-btn';
  backBtn.textContent = '← Ver outras categorias';
  backBtn.onclick = () => {
    const newGrid = document.createElement('div');
    newGrid.className = 'inline-catalog';
    const newLabel = document.createElement('div');
    newLabel.className = 'inline-catalog-label';
    newLabel.textContent = '📋 Aqui está o cardápio de ideias:';
    newGrid.appendChild(newLabel);
    newGrid.appendChild(buildCatalogGrid());
    wrap.replaceWith(newGrid);
    scrollToBottom();
  };
  wrap.appendChild(backBtn);

  return wrap;
}

/* Inserts a catalog card as its own row inside the conversation flow (not the empty-state welcome) */
function insertInlineCatalog(){
  removeWelcomeBlock();
  const wrap = document.createElement('div');
  wrap.className = 'inline-catalog';

  const label = document.createElement('div');
  label.className = 'inline-catalog-label';
  label.textContent = '📋 Aqui está o cardápio de ideias:';
  wrap.appendChild(label);
  wrap.appendChild(buildCatalogGrid());

  chatEl.appendChild(wrap);
  scrollToBottom();
}

function renderStoredMessage(m){
  if(m.role === 'user'){
    addUserBubble(extractTextFromContent(m.content), extractImageFromContent(m.content));
  } else {
    addAssistantBubble(extractTextFromContent(m.content), false, true);
  }
}

function extractTextFromContent(content){
  if(typeof content === 'string') return content;
  const t = content.find(c => c.type === 'text');
  return t ? t.text : '';
}
function extractImageFromContent(content){
  if(typeof content === 'string') return null;
  const img = content.find(c => c.type === 'image');
  if(!img) return null;
  return `data:${img.source.media_type};base64,${img.source.data}`;
}

function scrollToBottom(){

function removeWelcomeBlock(){

  removeWelcomeBlock();
  const row = document.createElement('div');
  row.className = 'msg-row user';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  if(text) bubble.appendChild(document.createTextNode(text));
  if(imageDataUrl){
    const img = document.createElement('img');
    img.className = 'attached';
    img.src = imageDataUrl;
    bubble.appendChild(img);
  }
  row.appendChild(bubble);
  chatEl.appendChild(row);
  scrollToBottom();
}

function renderAssistantContent(bubble, text, skipTimers){
  const markerRegex = /\[TIMER:\s*(\d+)\s*\|\s*([^\]]+)\]|\[CATALOGO\]/g;
  let lastIndex = 0;
  let match;
  const fragments = [];
  while((match = markerRegex.exec(text)) !== null){
    fragments.push({type:'text', value: text.slice(lastIndex, match.index)});
    if(match[0] === '[CATALOGO]'){
      fragments.push({type:'catalog'});
    } else {
      fragments.push({type:'timer', seconds: parseInt(match[1]), label: match[2].trim()});
    }
    lastIndex = match.index + match[0].length;
  }
  fragments.push({type:'text', value: text.slice(lastIndex)});

  fragments.forEach(f => {
    if(f.type === 'text'){
      if(f.value.trim().length === 0) return;
      const span = document.createElement('span');
      span.textContent = f.value.replace(/^\n+|\n+$/g,'');
      bubble.appendChild(span);
      bubble.appendChild(document.createElement('br'));
    } else if(f.type === 'timer'){
      bubble.appendChild(buildTimerCard(f.seconds, f.label));
    } else if(f.type === 'catalog'){
      const catalogLabel = document.createElement('div');
      catalogLabel.className = 'inline-catalog-label';
      catalogLabel.style.marginTop = '10px';
      catalogLabel.textContent = '📋 Aqui está o cardápio de ideias:';
      bubble.appendChild(catalogLabel);
      bubble.appendChild(buildCatalogGrid());
    }
  });
}

function buildTimerCard(totalSeconds, label){
  const card = document.createElement('div');
  card.className = 'timer-card';

  const num = document.createElement('div');
  num.className = 'tnum';
  num.textContent = formatTime(totalSeconds);

  const labelEl = document.createElement('div');
  labelEl.textContent = '⏱ ' + label;
  labelEl.style.flex = '1';

  const btn = document.createElement('button');
  btn.textContent = 'Iniciar';

  let remaining = totalSeconds;
  let interval = null;

  btn.onclick = () => {
    if(interval){
      clearInterval(interval);
      interval = null;
      btn.textContent = 'Continuar';
      return;
    }
    btn.textContent = 'Pausar';
    interval = setInterval(()=>{
      remaining--;
      num.textContent = formatTime(remaining);
      if(remaining <= 0){
        clearInterval(interval);
        interval = null;
        num.textContent = '🔔 Pronto!';
        btn.disabled = true;
        try{ new AudioContext(); }catch(e){}
        if(navigator.vibrate) navigator.vibrate([200,100,200]);
      }
    }, 1000);
  };

  card.appendChild(num);
  card.appendChild(labelEl);
  card.appendChild(btn);
  return card;
}

function formatTime(s){
  const m = Math.floor(s/60);
  const sec = s % 60;
  return `${m}:${sec.toString().padStart(2,'0')}`;
}

/* ================= IMAGE HANDLING ================= */
function fileToBase64(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = () => {
      const result = reader.result;
      const base64 = result.split(',')[1];
      resolve({base64, dataUrl: result, mediaType: file.type});
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function handleFileSelected(file){
  if(!file) return;
  const {base64, dataUrl, mediaType} = await fileToBase64(file);
  pendingImage = {base64, mediaType, dataUrl};
  previewImg.src = dataUrl;
  previewInfo.textContent = 'foto pronta — escreva algo (opcional) e envie';
  previewBar.classList.add('show');
}

cameraBtn.onclick = () => cameraInput.click();
galleryBtn.onclick = () => galleryInput.click();
catalogBtn.onclick = () => insertInlineCatalog();
cameraInput.onchange = (e) => handleFileSelected(e.target.files[0]);
galleryInput.onchange = (e) => handleFileSelected(e.target.files[0]);
removePreview.onclick = () => {
  pendingImage = null;
  previewBar.classList.remove('show');
  cameraInput.value = '';
  galleryInput.value = '';
};

/* ================= AUDIO / SPEECH-TO-TEXT ================= */
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if(SpeechRecognition){
  recognition = new SpeechRecognition();
  recognition.lang = 'pt-BR';
  recognition.continuous = false;
  recognition.interimResults = true;

  recognition.onresult = (event) => {
    let transcript = '';
    for(let i = 0; i < event.results.length; i++){
      transcript += event.results[i][0].transcript;
    }
    textInput.value = transcript;
    autoResize();
  };

  recognition.onend = () => {
    isRecording = false;
    micBtn.classList.remove('recording');
    micBtn.textContent = '🎤';
  };

  recognition.onerror = (event) => {
    isRecording = false;
    micBtn.classList.remove('recording');
    micBtn.textContent = '🎤';
    if(event.error === 'not-allowed'){
      alert('Preciso de permissão pra usar o microfone. Verifique as permissões do navegador.');
    }
  };
} else {
  micBtn.title = 'Reconhecimento de voz não suportado neste navegador (use o Chrome)';
}

micBtn.onclick = () => {
  if(!recognition){
    alert('Esse navegador não suporta reconhecimento de voz. Tente usar o Chrome.');
    return;
  }
  if(isRecording){
    recognition.stop();
    return;
  }
  isRecording = true;
  micBtn.classList.add('recording');
  micBtn.textContent = '⏹️';
  try{
    recognition.start();
  }catch(e){
    isRecording = false;
    micBtn.classList.remove('recording');
    micBtn.textContent = '🎤';
  }
};

/* ================= TEXTAREA AUTO-RESIZE ================= */
function autoResize(){
  textInput.style.height = 'auto';
  textInput.style.height = Math.min(textInput.scrollHeight, 110) + 'px';
}
textInput.addEventListener('input', autoResize);
textInput.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});

/* ================= CRÉDITOS / SUPABASE ================= */

function atualizarSaldoBadge(restantes){
  const badge = document.getElementById('saldoBadge');
  if(!badge) return;
  if(restantes === null || restantes === undefined){ badge.style.display='none'; return; }
  badge.style.display = 'block';
  badge.textContent = `💬 ${restantes} mensagem${restantes !== 1 ? 's' : ''} restante${restantes !== 1 ? 's' : ''}`;
  badge.style.color = restantes <= 3 ? '#8c2f2f' : 'var(--ink-soft)';
}

function mostrarAvisoSaldo(mensagem){
  removeWelcomeBlock();
  const aviso = document.createElement('div');
  aviso.className = 'aviso-credito';
  aviso.innerHTML = `<span>⚠️ ${mensagem}</span><a href="${KIWIFY_LINK}" target="_blank">Comprar mais</a>`;
  chatEl.appendChild(aviso);

function mostrarBloqueio(){
  creditosBloqueado = true;
  removeWelcomeBlock();
  // desativa a barra de input
  textInput.disabled = true;
  sendBtn.disabled = true;
  cameraBtn.disabled = true;
  galleryBtn.disabled = true;
  micBtn.disabled = true;
  textInput.placeholder = 'Créditos esgotados';

  const bloco = document.createElement('div');
  bloco.className = 'bloqueio-credito';
  bloco.innerHTML = `
    <div class="bloqueio-icon">🍳</div>
    <h3>Seus créditos acabaram!</h3>
    <p>Você usou todas as suas mensagens com o Master Chef do Amor. Garanta mais créditos para continuar cozinhando com amor! ❤️</p>
    <a href="${KIWIFY_LINK}" target="_blank">Garantir 100 mensagens</a>
  `;
  chatEl.appendChild(bloco);

}

async function descontarCredito(){
  if(!alunoEmail) return { status: 'sem_email' };

  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/descontar-credito`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: alunoEmail, professor_slug: PROFESSOR_SLUG })
    });
    const data = await res.json();
    atualizarSaldoBadge(data.mensagens_restantes);
    return data;
  } catch(e) {
    console.error('Erro ao descontar crédito:', e);
    // Se der erro de rede, permite continuar (não bloqueia o usuário por problema técnico)
    return { status: 'ok' };
  }
}

/* ================= INDICAÇÃO ================= */

// Captura o código de indicação da URL (ex: ?ref=AMOR4F2K), se presente
function getCodigoIndicacaoDaURL(){
  const params = new URLSearchParams(window.location.search);
  return params.get('ref');
}

// Gera (ou recupera) o código de indicação do aluno e atualiza a caixa nas configurações
async function carregarMeuCodigoIndicacao(){
  if(!alunoEmail) {
    indicacaoBox.style.display = 'none';
    return;
  }
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/gerar-codigo-indicacao`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: alunoEmail })
    });
    const data = await res.json();
    if(data.codigo){
      const link = `${window.location.origin}${window.location.pathname}?ref=${data.codigo}`;
      linkIndicacaoInput.value = link;
      indicacaoBox.style.display = 'block';
    }
  } catch(e) {
    console.error('Erro ao carregar código de indicação:', e);
  }
}

// Registra a indicação (se o aluno chegou via link de alguém) — chamado uma vez, ao salvar o e-mail
async function registrarIndicacaoSeNecessario(){
  const codigo = getCodigoIndicacaoDaURL();
  if(!codigo || !alunoEmail) return;

  // Evita registrar de novo se já tentamos nesta sessão/navegador
  const jaTentou = localStorage.getItem('culinaria_indicacao_tentada');
  if(jaTentou === codigo) return;

  try {
    await fetch(`${SUPABASE_URL}/functions/v1/registrar-indicacao`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email_indicado: alunoEmail, codigo: codigo, professor_slug: PROFESSOR_SLUG })
    });
    localStorage.setItem('culinaria_indicacao_tentada', codigo);
  } catch(e) {
    console.error('Erro ao registrar indicação:', e);
  }
}

copiarLinkBtn.onclick = () => {

/* ================= SEND MESSAGE / API CALL ================= */
sendBtn.onclick = sendMessage;

/* Retorna apenas as últimas MAX_HISTORICO_TROCAS trocas (usuário+chef) da conversa,
   para controlar o custo de API em conversas longas. O histórico completo continua
   salvo e visível na tela — só o que é enviado para a API é reduzido.
   Garante que o array sempre comece com uma mensagem do usuário, como a API exige. */
function getMensagensParaAPI(){
  const limiteDeItens = MAX_HISTORICO_TROCAS * 2; // cada troca = 1 user + 1 assistant
  if(messages.length <= limiteDeItens) return messages;

  let cortado = messages.slice(-limiteDeItens);
  // se por algum motivo o corte começar com 'assistant', remove esse item solto
  if(cortado.length > 0 && cortado[0].role !== 'user'){
    cortado = cortado.slice(1);
  }
  return cortado;
}

async function sendMessage(){
  if(isSending || creditosBloqueado) return;
  const text = textInput.value.trim();
  if(!text && !pendingImage) return;

  if(exigeConfiguracao()) return;

  const userContentParts = [];
  if(pendingImage){
    userContentParts.push({
      type: 'image',
      source: { type: 'base64', media_type: pendingImage.mediaType, data: pendingImage.base64 }
    });
  }
  if(text){
    userContentParts.push({ type: 'text', text: text });
  } else {
    userContentParts.push({ type: 'text', text: '(enviei uma foto)' });
  }

  const imageForDisplay = pendingImage ? pendingImage.dataUrl : null;
  addUserBubble(text, imageForDisplay);

  messages.push({ role: 'user', content: userContentParts });
  saveMessages();

  textInput.value = '';
  autoResize();
  pendingImage = null;
  previewBar.classList.remove('show');
  cameraInput.value = '';
  galleryInput.value = '';

  isSending = true;
  sendBtn.disabled = true;
  const typingBubble = addAssistantBubble('', true);

  try{
    // 1. Desconta 1 crédito antes de chamar a IA
    const credito = await descontarCredito();

    if(credito.status === 'bloqueado' || credito.status === 'ultimo_credito_usado'){
      typingBubble.remove();
      mostrarBloqueio();
      isSending = false;
      return;
    }

    if(credito.aviso){
      mostrarAvisoSaldo(credito.aviso);
    }

    // 2. Chama a Edge Function do Supabase (sua chave fica segura no servidor,
    //    nunca exposta no navegador do cliente)
    const response = await fetch(`${SUPABASE_URL}/functions/v1/chat-anthropic`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        model: MODEL,
        max_tokens: 1500,
        system: SYSTEM_PROMPT,
        messages: getMensagensParaAPI()
      })
    });

    if(!response.ok){
      const errBody = await response.json().catch(()=>({}));
      throw new Error(errBody?.erro || `Erro ${response.status}`);
    }

    const data = await response.json();
    const textBlocks = data.content.filter(c => c.type === 'text').map(c => c.text);
    const fullText = textBlocks.join('\n');

    messages.push({ role: 'assistant', content: fullText });
    saveMessages();

    typingBubble.innerHTML = '';
    renderAssistantContent(typingBubble, fullText);
    scrollToBottom();

  }catch(err){
    typingBubble.innerHTML = '';
    typingBubble.style.color = '#a33';
    typingBubble.textContent = '⚠️ Deu um erro: ' + err.message;
  }finally{
    isSending = false;
    sendBtn.disabled = false;
  }
}

function saveMessages(){
  localStorage.setItem('culinaria_messages', JSON.stringify(messages));
}

openSettings.onclick = () => {
  document.getElementById('modalTitle').textContent = 'Configurações';

    acaoPendente = null;
  }
};
saveKeyBtn.onclick = () => {
  alunoEmail = emailInput.value.trim().toLowerCase();
  localStorage.setItem('culinaria_email', alunoEmail);
  updateStatus();
  settingsModal.classList.remove('show');

  if(!alunoEmail) return;

  // Registra a indicação (se veio de um link de indicação) e carrega/gera o código próprio
  registrarIndicacaoSeNecessario();
  carregarMeuCodigoIndicacao();

  // Retoma automaticamente a ação que o usuário tentou fazer antes de configurar o e-mail
  if(acaoPendente){
    const acao = acaoPendente;
    acaoPendente = null;
    acao();
  } else if(chatEl.children.length === 0){
    // Garantia extra: nunca deixar a tela vazia
    renderAll();
  }
};
clearChatBtn.onclick = () => {
  if(confirm('Tem certeza que quer limpar toda a conversa?')){
    messages = [];
    localStorage.removeItem('culinaria_messages');
    renderAll();
    settingsModal.classList.remove('show');
  }
};

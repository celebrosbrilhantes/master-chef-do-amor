<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Master Chef do Amor</title>
<style>
  :root{
    --bg-deep: #3a1212;
    --bg-deep-2: #5a1c1c;
    --wine: #8c2f2f;
    --wine-2: #a83a3a;
    --gold: #d99a3f;
    --gold-2: #e8b35e;
    --cream: #fff8ef;
    --cream-2: #fbecd8;
    --ink: #3a1212;
    --ink-soft: #7a5a4a;
    --line: #ecd6b8;
    font-size: 18px;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: 'Avenir Next', 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg-deep);
    color: var(--ink);
    overscroll-behavior: none;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh; /* dvh = dynamic viewport height, considera barras do navegador mobile */
    max-width: 600px;
    margin: 0 auto;
    background: var(--cream);
    position: relative;
    box-shadow: 0 0 60px rgba(0,0,0,0.45);
  }

  /* ---------- HEADER ---------- */
  header {
    background: linear-gradient(135deg, var(--bg-deep-2), var(--bg-deep));
    color: var(--cream);
    padding: 20px 18px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
  }
  header::after{
    content:"";
    position:absolute; right:-30px; top:-40px;
    width:160px; height:160px;
    background: radial-gradient(circle, rgba(217,154,63,0.35), transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  .chef-icon {
    width: 54px; height: 54px;
    border-radius: 50%;
    background: var(--gold);
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
    flex-shrink: 0;
    box-shadow: 0 3px 12px rgba(0,0,0,0.35);
    overflow: hidden;
  }
  .chef-icon img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .header-text h1 {
    margin: 0; font-size: 21px; font-weight: 800; letter-spacing: 0.2px;
    line-height: 1.2;
  }
  .header-text p {
    margin: 4px 0 0; font-size: 14px; color: #f0d9b8; font-weight: 400;
  }
  .gear-btn{
    margin-left:auto;
    background: rgba(255,255,255,0.10);
    border: 1px solid rgba(255,255,255,0.22);
    color: var(--cream);
    width: 44px; height: 44px; border-radius: 12px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:20px;
    flex-shrink: 0;
    position: relative;
    z-index: 5;
  }
  .gear-btn:active{ background: rgba(255,255,255,0.22); }

  /* ---------- CHAT ---------- */
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    background:
      radial-gradient(circle at 10% 15%, rgba(140,47,47,0.05), transparent 35%),
      radial-gradient(circle at 90% 85%, rgba(217,154,63,0.08), transparent 40%),
      var(--cream);
  }

  /* ---------- WELCOME ---------- */
  #welcomeBlock {
    text-align: center;
    padding: 6px 4px 4px;
  }
  #welcomeBlock h2 {
    font-size: 20px;
    margin: 0 0 6px;
    color: var(--wine);
    font-weight: 800;
  }
  #welcomeBlock p {
    font-size: 16px;
    color: var(--ink-soft);
    margin: 0 0 16px;
    line-height: 1.4;
  }

  /* ---------- CATÁLOGO REGIONAL (27 estados) ---------- */
  .catalogo-wrap {
    background: var(--cream-2);
    border: 2px dashed var(--gold);
    border-radius: 18px;
    padding: 0 12px 14px;
    margin: 2px 0;
    overflow: hidden;
    text-align: left;
    flex-shrink: 0; /* impede o flex do #chat de esmagar o catálogo */
  }
  .catalog-banner {
    background: linear-gradient(135deg, var(--gold-2), var(--gold));
    color: var(--bg-deep);
    font-size: 15px;
    font-weight: 600;
    line-height: 1.4;
    padding: 12px 14px;
    margin: 0 -12px 6px;
  }
  .catalogo-titulo {
    font-size: 16.5px;
    font-weight: 800;
    color: var(--wine);
    margin: 14px 2px 4px;
    line-height: 1.35;
  }
  .pilar-list { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
  .pilar-btn {
    display: flex; align-items: center; gap: 14px;
    background: var(--cream);
    border: 2px solid var(--line);
    border-radius: 16px;
    padding: 14px 16px;
    cursor: pointer;
    font-family: inherit;
    text-align: left;
    width: 100%;
    transition: background 0.12s, transform 0.1s;
  }
  .pilar-btn:active { transform: scale(0.98); background: #f7e2c4; }
  .pilar-btn .picon { font-size: 30px; line-height: 1; flex-shrink: 0; }
  .pilar-btn .ptitulo { font-size: 17px; font-weight: 800; color: var(--wine); line-height: 1.25; }
  .pilar-btn .psub { font-size: 14px; color: var(--ink-soft); margin-top: 3px; line-height: 1.3; }
  .pilar-btn.featured { background: linear-gradient(135deg, var(--gold-2), var(--gold)); border-color: var(--gold); }
  .pilar-btn.featured .ptitulo { color: var(--bg-deep); }
  .pilar-btn.featured .psub { color: #5a3a10; }
  .region-title {
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 1.5px;
    color: var(--wine);
    margin: 16px 2px 10px;
    padding-bottom: 5px;
    border-bottom: 2px solid var(--line);
  }
  .state-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .state-btn {
    background: var(--cream);
    border: 2px solid var(--line);
    border-radius: 12px;
    padding: 13px 8px;
    font-size: 16px;
    font-weight: 700;
    color: var(--ink);
    text-align: center;
    cursor: pointer;
    font-family: inherit;
    line-height: 1.25;
    transition: background 0.12s, transform 0.1s;
  }
  .state-btn:active { transform: scale(0.97); background: #f7e2c4; }

  .inline-catalog-label {
    font-size: 16px;
    font-weight: 700;
    color: var(--wine);
    margin: 14px 2px 10px;
  }

  .recipe-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 10px;
  }
  .recipe-item {
    background: var(--cream);
    border: 2px solid var(--line);
    border-radius: 12px;
    padding: 13px 16px;
    font-size: 16.5px;
    font-weight: 600;
    color: var(--ink);
    text-align: left;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.12s, transform 0.1s;
  }
  .recipe-item:active { transform: scale(0.98); background: #f7e2c4; }
  .recipe-item::before {
    content: "🍽 ";
  }
  .recipe-back-btn {
    background: none;
    border: none;
    color: var(--wine);
    font-size: 15px;
    font-weight: 700;
    padding: 8px 4px 2px;
    cursor: pointer;
    font-family: inherit;
  }

  /* bolha que contém o catálogo ocupa a largura toda */
  .msg-row.assistant .bubble.bubble-catalogo { max-width: 100%; flex: 1; }

  .msg-row { display: flex; gap: 12px; max-width: 100%; }
  .msg-row.user { justify-content: flex-end; }

  .avatar {
    width: 38px; height: 38px; border-radius: 50%;
    background: var(--gold);
    flex-shrink: 0;
    display:flex; align-items:center; justify-content:center;
    font-size: 19px;
    margin-top: 2px;
    overflow: hidden;
  }
  .avatar img {
    width: 100%; height: 100%; object-fit: cover; object-position: top center;
  }

  .bubble {
    padding: 14px 16px;
    border-radius: 18px;
    line-height: 1.55;
    font-size: 17.5px;
    max-width: 80%;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg-row.assistant .bubble {
    background: var(--cream-2);
    border: 2px solid var(--line);
    border-top-left-radius: 5px;
    color: var(--ink);
  }
  .msg-row.user .bubble {
    background: var(--wine);
    color: white;
    border-top-right-radius: 5px;
  }
  .bubble img.attached {
    max-width: 100%;
    border-radius: 12px;
    margin-top: 8px;
    display: block;
  }

  .typing-dots {
    display: flex; gap: 5px; padding: 8px 4px;
  }
  .typing-dots span {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--ink-soft);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2){ animation-delay: 0.15s; }
  .typing-dots span:nth-child(3){ animation-delay: 0.3s; }
  @keyframes bounce { 0%,80%,100%{ transform: translateY(0); opacity:0.4;} 40%{ transform: translateY(-4px); opacity:1;} }

  /* timer card inline */
  .timer-card{
    margin-top: 10px;
    background: var(--bg-deep);
    color: var(--cream);
    border-radius: 14px;
    padding: 14px 16px;
    display:flex; align-items:center; gap:12px;
    font-size: 16px;
  }
  .timer-card .tnum{
    font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums;
    color: var(--gold-2);
    min-width: 66px;
  }
  .timer-card button{
    margin-left:auto;
    background: var(--gold);
    border:none; color: var(--bg-deep);
    padding: 9px 16px; border-radius: 10px;
    font-size: 15px; font-weight: 700; cursor:pointer;
  }
  .timer-card button:disabled{ opacity:0.5; }

  /* ---------- ATTACH PREVIEW ---------- */
  #preview-bar {
    display: none;
    padding: 12px 16px 0;
    flex-shrink: 0;
    background: var(--cream);
  }
  #preview-bar.show { display: flex; align-items:center; gap: 12px; }
  #preview-bar img { width: 60px; height: 60px; object-fit: cover; border-radius: 12px; border: 2px solid var(--line); }
  #preview-bar .pv-info{ font-size: 15px; color: var(--ink-soft); flex:1; }
  #preview-bar .pv-remove{
    background: none; border: none; font-size: 22px; color: var(--ink-soft); cursor: pointer;
    padding: 6px;
  }

  /* ---------- INPUT BAR ---------- */
  #inputbar {
    display: flex;
    align-items: flex-end;
    gap: 6px;
    padding: 10px 8px;
    background: var(--cream);
    border-top: 2px solid var(--line);
    flex-shrink: 0;
  }
  .icon-btn {
    width: 44px; height: 44px;
    border-radius: 50%;
    border: none;
    background: var(--cream-2);
    color: var(--ink);
    font-size: 19px;
    flex-shrink: 0;
    display:flex; align-items:center; justify-content:center;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    border: 2px solid var(--line);
  }
  .icon-btn:active{ transform: scale(0.93); }
  .icon-btn.recording {
    background: var(--wine);
    color: white;
    border-color: var(--wine);
    animation: pulse 1s infinite;
  }
  @keyframes pulse { 0%,100%{ box-shadow: 0 0 0 0 rgba(140,47,47,0.5);} 50%{ box-shadow: 0 0 0 10px rgba(140,47,47,0);} }

  #textInput {
    flex: 1;
    border: 2px solid var(--line);
    background: white;
    border-radius: 24px;
    padding: 13px 18px;
    font-size: 17.5px;
    resize: none;
    max-height: 110px;
    font-family: inherit;
    line-height: 1.4;
  }
  #textInput:focus { outline: none; border-color: var(--gold); }

  #sendBtn {
    width: 50px; height: 50px;
    border-radius: 50%;
    border: none;
    background: var(--wine);
    color: white;
    font-size: 20px;
    flex-shrink: 0;
    cursor: pointer;
    display:flex; align-items:center; justify-content:center;
  }
  #sendBtn:disabled { opacity: 0.4; }

  /* ---------- SETTINGS MODAL ---------- */
  #settingsModal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    display: none;
    align-items: center; justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  #settingsModal.show { display: flex; }
  .modal-box {
    background: var(--cream);
    border-radius: 20px;
    padding: 26px;
    max-width: 440px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
  }
  .modal-box h2 { margin: 0 0 6px; font-size: 21px; color: var(--wine); }
  .modal-box p.hint { font-size: 15px; color: var(--ink-soft); margin: 0 0 18px; line-height: 1.4; }
  .modal-box label { font-size: 16px; font-weight: 700; display:block; margin-bottom: 8px; margin-top: 16px; }
  .modal-box input[type=password], .modal-box input[type=text] {
    width: 100%; padding: 13px 14px; border-radius: 12px;
    border: 2px solid var(--line); font-size: 16px;
  }
  .modal-box .row-btns { display:flex; gap:12px; margin-top: 22px; }
  .modal-box button.primary {
    flex:1; background: var(--wine); color:white; border:none;
    padding: 14px; border-radius: 12px; font-size: 16px; font-weight:700; cursor:pointer;
  }
  .modal-box button.secondary {
    background: none; border: 2px solid var(--line); color: var(--ink);
    padding: 14px 18px; border-radius: 12px; font-size: 16px; cursor:pointer;
  }
  .status-dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:8px; }
  .status-dot.ok { background: #5c8a4f; }
  .status-dot.off { background: var(--wine); }

  input[type=file] { display: none; }

  /* scrollbar */
  #chat::-webkit-scrollbar{ width:6px; }
  #chat::-webkit-scrollbar-thumb{ background: var(--line); border-radius: 4px; }

  /* ---------- CRÉDITOS ---------- */
  .aviso-credito {
    background: linear-gradient(135deg, #fff3cd, #ffeaa7);
    border: 2px solid var(--gold);
    border-radius: 16px;
    padding: 14px 16px;
    font-size: 16px;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 4px 0;
  }
  .aviso-credito span { flex: 1; }
  .aviso-credito a {
    background: var(--wine);
    color: white;
    padding: 8px 14px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    text-decoration: none;
    white-space: nowrap;
  }

  .bloqueio-credito {
    text-align: center;
    padding: 28px 20px;
    background: var(--cream-2);
    border: 2px solid var(--line);
    border-radius: 18px;
    margin: 10px 0;
  }
  .bloqueio-credito .bloqueio-icon { font-size: 44px; margin-bottom: 10px; }
  .bloqueio-credito h3 { font-size: 20px; color: var(--wine); margin: 0 0 8px; }
  .bloqueio-credito p { font-size: 16px; color: var(--ink-soft); margin: 0 0 18px; line-height: 1.4; }
  .bloqueio-credito a {
    display: inline-block;
    background: var(--wine);
    color: white;
    padding: 14px 28px;
    border-radius: 14px;
    font-size: 17px;
    font-weight: 700;
    text-decoration: none;
  }

  .saldo-badge {
    font-size: 13px;
    color: var(--ink-soft);
    text-align: right;
    padding: 2px 16px 4px;
    flex-shrink: 0;
    background: var(--cream);
  }
</style>
</head>

## O QUE VOCÊ SEMPRE FAZ
- Responde qualquer dúvida de culinária: receitas, técnicas, substituição de ingredientes, medidas, conservação de alimentos, organização de cozinha e economia no supermercado.
- Adapta receitas ao que o usuário tem em casa — se falta ingrediente, sugere substituto em vez de mandar comprar.
- Pergunta o essencial antes de dar a receita quando fizer diferença (quantas pessoas? tem forno?), mas no máximo 1 pergunta por vez.
- Dá medidas práticas brasileiras: xícara, colher de sopa, "fio de azeite" — nunca só gramas.
- Termina receitas com um incentivo curto e caloroso.

## O QUE VOCÊ NUNCA FAZ
- Nunca dá orientação médica ou nutricional para condições de saúde (diabetes, hipertensão, alergia grave, dieta prescrita, gestante com restrição). Nesses casos, acolha com carinho, diga que isso é assunto para médico ou nutricionista, e ofereça ajudar com o que estiver ao seu alcance na cozinha.
- Nunca responde assuntos fora de culinária e cozinha (política, tarefas de trabalho, textos, códigos). Redirecione com simpatia: "Ih, meu bem, disso eu não entendo — meu mundo é a cozinha! Mas me conta: o que você quer cozinhar hoje?"
- Nunca fala de preços, créditos, pagamento ou problemas técnicos do app — diga que isso é com o suporte.
- Nunca inventa receita perigosa (combinações tóxicas, conservação errada de alimentos).
- Nunca quebra o personagem nem menciona que é uma IA, Claude ou Anthropic.

## MARCADORES TÉCNICOS DO APP
O app transforma marcadores em botões dentro da mensagem. O usuário nunca vê o código — escreva o marcador no formato exato, sem explicá-lo na conversa.

**Cronômetro:**
- Sempre que uma etapa tiver tempo definido (assar, cozinhar, descansar, marinar), inclua na mesma linha: [TIMER: segundos | rótulo]
- Exemplo: "Leve ao forno por 40 minutos [TIMER: 2400 | Bolo no forno]"
- Máximo 2 timers por resposta, nas etapas mais importantes.
- Rótulo curto e claro (2 a 4 palavras).

**Catálogo:**
- Quando o usuário parecer perdido, sem ideia do que cozinhar, ou pedir sugestão genérica ("o que eu faço hoje?"), inclua [CATALOGO] no final da resposta.
- Exemplo: "Tenho várias ideias deliciosas pra te mostrar! Dá uma olhada: [CATALOGO]"
- NUNCA use [CATALOGO] se o usuário já chegou por uma receita do catálogo — ele já escolheu, siga direto com a receita.
- Máximo 1 vez por resposta.

## SITUAÇÕES ESPECÍFICAS

**Foto da geladeira/despensa:**
- Identifique os ingredientes visíveis com atenção.
- Sugira 2 a 3 receitas possíveis, da mais simples à mais elaborada.
- Se a foto estiver escura ou confusa, pergunte com simpatia o que tem lá em vez de chutar.
- Nunca invente ingrediente que não dá pra ver.

**Dúvida de saúde/dieta:**
- Temas gerais (comida mais leve, menos fritura, mais legumes): responda normalmente.
- Condição médica específica: acolha, oriente procurar médico ou nutricionista, e ofereça ajudar com o que puder sem risco. Exemplo: "Meu bem, isso é coisa séria e quem pode te orientar direitinho é um nutricionista ou seu médico, tá? Mas se quiser, te ajudo com receitas leves e saborosas pro dia a dia!"

**Usuário iniciante total:**
- Se perceber que a pessoa nunca cozinhou, simplifique tudo: explique até o óbvio (como saber se a panela está quente, o que é refogar) sem nunca soar condescendente.

**Usuário frustrado (receita deu errado):**
- Primeiro acolha, depois diagnostique: pergunte o que aconteceu e identifique o provável erro com gentileza.
- Transforme o erro em aprendizado, nunca em culpa.

**Criança ou adolescente:**
- Se perceber que é uma criança, priorize receitas sem fogo e sem faca afiada, e sempre recomende chamar um adulto para etapas de fogão e forno.

## FORMATO DAS RESPOSTAS
- Respostas curtas e diretas — o usuário está no celular.
- Conversa normal (dúvida, substituição, dica): 2 a 5 frases.
- Nunca escreva parágrafos longos.
- Negrito só em nomes de receita e títulos de seção.
- Se o usuário pedir várias receitas de uma vez: dê os nomes primeiro e pergunte qual ele quer completa — nunca despeje várias receitas inteiras numa resposta só.

**Estrutura fixa de receita completa:**

🍲 **Nome da Receita**
⏱️ Tempo total | 🍽️ Rende X porções

**Ingredientes:**
- lista com medidas práticas (xícara, colher)

**Modo de preparo:**
1. Passos numerados, curtos, um por linha
2. Inclua [TIMER] nas etapas com tempo

💛 Uma frase curta de incentivo no final

    icon.textContent = pilar.emoji;

    const textos = document.createElement('div');
    const t = document.createElement('div');
    t.className = 'ptitulo';
    t.textContent = pilar.titulo;
    textos.appendChild(t);
    if(pilar.subtitulo){
      const s = document.createElement('div');
      s.className = 'psub';
      s.textContent = pilar.subtitulo;
      textos.appendChild(s);

    btn.appendChild(icon);
    btn.appendChild(textos);
    btn.onclick = () => {
      if(pilar.id === 'brasil'){
        mostrarEstados(wrap, body);
      } else if(pilar.categorias){
        mostrarCategorias(wrap, body, pilar);
      } else {
        mostrarPratosSimples(wrap, body, pilar);

      rolarParaTopoCatalogo(wrap);
    };
    list.appendChild(btn);

function mostrarPratos(wrap, body, estado){
  body.innerHTML = '';

  const label = document.createElement('div');
  label.className = 'inline-catalog-label';
  label.textContent = `🍽 ${estado.nome} — escolha um prato:`;

  const list = document.createElement('div');

  estado.pratos.forEach(prato => {

    item.textContent = prato;

        sendMessage();

      if(exigeConfiguracao(continuar)) return;
      continuar();

    list.appendChild(item);

  const backBtn = document.createElement('button');
  backBtn.className = 'recipe-back-btn';
  backBtn.textContent = '← Voltar para os estados';
  backBtn.onclick = () => { mostrarEstados(wrap, body); rolarParaTopoCatalogo(wrap); };

}

/* Nível 2 (pilar com categorias, ex: Comida do Dia a Dia) */
function mostrarCategorias(wrap, body, pilar){
  body.innerHTML = '';

  const label = document.createElement('div');
  label.className = 'inline-catalog-label';
  label.textContent = `${pilar.emoji} ${pilar.titulo} — escolha uma categoria:`;
  body.appendChild(label);

  const grid = document.createElement('div');
  grid.className = 'state-grid';
  pilar.categorias.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'state-btn';
    btn.textContent = `${cat.emoji} ${cat.nome}`;
    btn.onclick = () => {
      mostrarPratosDeCategoria(wrap, body, pilar, cat);
      rolarParaTopoCatalogo(wrap);
    };
    grid.appendChild(btn);
  });
  body.appendChild(grid);

  const backBtn = document.createElement('button');
  backBtn.className = 'recipe-back-btn';
  backBtn.textContent = '← Voltar ao cardápio';
  backBtn.onclick = () => { mostrarPilares(wrap, body); rolarParaTopoCatalogo(wrap); };
  body.appendChild(backBtn);
}

/* Inserts the catalog as its own row inside the conversation flow */
function insertInlineCatalog(){
  removeWelcomeBlock();
  chatEl.appendChild(buildCatalogGrid());
  scrollToBottom();
}

function renderStoredMessage(m){
  if(m.role === 'user'){
    addUserBubble(extractTextFromContent(m.content), extractImageFromContent(m.content));
  } else {
    addAssistantBubble(extractTextFromContent(m.content), false, true);
  }
}

function extractTextFromContent(content){
  if(typeof content === 'string') return content;
  const t = content.find(c => c.type === 'text');
  return t ? t.text : '';
}
function extractImageFromContent(content){
  if(typeof content === 'string') return null;
  const img = content.find(c => c.type === 'image');
  if(!img) return null;
  return `data:${img.source.media_type};base64,${img.source.data}`;
}

updateStatus();
renderAll();
if(alunoEmail){ carregarMeuCodigoIndicacao(); }

/* ================= UI HELPERS ================= */
function scrollToBottom(){
  requestAnimationFrame(()=>{ chatEl.scrollTop = chatEl.scrollHeight; });
}

function removeWelcomeBlock(){
  const w = document.getElementById('welcomeBlock');
  if(w) w.remove();
}

function addUserBubble(text, imageDataUrl){
  removeWelcomeBlock();
  const row = document.createElement('div');
  row.className = 'msg-row user';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  if(text) bubble.appendChild(document.createTextNode(text));
  if(imageDataUrl){
    const img = document.createElement('img');
    img.className = 'attached';
    img.src = imageDataUrl;
    bubble.appendChild(img);
  }
  row.appendChild(bubble);
  chatEl.appendChild(row);
  scrollToBottom();
}

function renderAssistantContent(bubble, text, skipTimers){
  const markerRegex = /\[TIMER:\s*(\d+)\s*\|\s*([^\]]+)\]|\[CATALOGO\]/g;
  let lastIndex = 0;
  let match;
  const fragments = [];
  while((match = markerRegex.exec(text)) !== null){
    fragments.push({type:'text', value: text.slice(lastIndex, match.index)});
    if(match[0] === '[CATALOGO]'){
      fragments.push({type:'catalog'});
    } else {
      fragments.push({type:'timer', seconds: parseInt(match[1]), label: match[2].trim()});
    }
    lastIndex = match.index + match[0].length;
  }
  fragments.push({type:'text', value: text.slice(lastIndex)});

  fragments.forEach(f => {
    if(f.type === 'text'){
      if(f.value.trim().length === 0) return;
      const span = document.createElement('span');
      span.textContent = f.value.replace(/^\n+|\n+$/g,'');
      bubble.appendChild(span);
      bubble.appendChild(document.createElement('br'));
    } else if(f.type === 'timer'){
      bubble.appendChild(buildTimerCard(f.seconds, f.label));
    } else if(f.type === 'catalog'){
      bubble.classList.add('bubble-catalogo');
      bubble.appendChild(buildCatalogGrid());
    }
  });
}

function buildTimerCard(totalSeconds, label){
  const card = document.createElement('div');
  card.className = 'timer-card';

  const num = document.createElement('div');
  num.className = 'tnum';
  num.textContent = formatTime(totalSeconds);

  const labelEl = document.createElement('div');
  labelEl.textContent = '⏱ ' + label;
  labelEl.style.flex = '1';

  const btn = document.createElement('button');
  btn.textContent = 'Iniciar';

  let remaining = totalSeconds;
  let interval = null;

  btn.onclick = () => {
    if(interval){
      clearInterval(interval);
      interval = null;
      btn.textContent = 'Continuar';
      return;
    }
    btn.textContent = 'Pausar';
    interval = setInterval(()=>{
      remaining--;
      num.textContent = formatTime(remaining);
      if(remaining <= 0){
        clearInterval(interval);
        interval = null;
        num.textContent = '🔔 Pronto!';
        btn.disabled = true;
        try{ new AudioContext(); }catch(e){}
        if(navigator.vibrate) navigator.vibrate([200,100,200]);
      }
    }, 1000);
  };

  card.appendChild(num);
  card.appendChild(labelEl);
  card.appendChild(btn);
  return card;
}

function formatTime(s){
  const m = Math.floor(s/60);
  const sec = s % 60;
  return `${m}:${sec.toString().padStart(2,'0')}`;
}

function fileToBase64(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = () => {
      const result = reader.result;
      const base64 = result.split(',')[1];
      resolve({base64, dataUrl: result, mediaType: file.type});
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function handleFileSelected(file){
  if(!file) return;
  const {base64, dataUrl, mediaType} = await fileToBase64(file);
  pendingImage = {base64, mediaType, dataUrl};
  previewImg.src = dataUrl;
  previewInfo.textContent = 'foto pronta — escreva algo (opcional) e envie';
  previewBar.classList.add('show');
}

/* ================= AUDIO / SPEECH-TO-TEXT ================= */
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if(SpeechRecognition){
  recognition = new SpeechRecognition();
  recognition.lang = 'pt-BR';
  recognition.continuous = false;
  recognition.interimResults = true;

  recognition.onresult = (event) => {
    let transcript = '';
    for(let i = 0; i < event.results.length; i++){
      transcript += event.results[i][0].transcript;
    }
    textInput.value = transcript;
    autoResize();
  };

  recognition.onend = () => {
    isRecording = false;
    micBtn.classList.remove('recording');
    micBtn.textContent = '🎤';
  };

  recognition.onerror = (event) => {
    isRecording = false;
    micBtn.classList.remove('recording');
    micBtn.textContent = '🎤';
    if(event.error === 'not-allowed'){
      alert('Preciso de permissão pra usar o microfone. Verifique as permissões do navegador.');
    }
  };
} else {
  micBtn.title = 'Reconhecimento de voz não suportado neste navegador (use o Chrome)';
}

micBtn.onclick = () => {
  if(!recognition){
    alert('Esse navegador não suporta reconhecimento de voz. Tente usar o Chrome.');
    return;
  }
  if(isRecording){
    recognition.stop();
    return;
  }
  isRecording = true;
  micBtn.classList.add('recording');
  micBtn.textContent = '⏹️';
  try{
    recognition.start();
  }catch(e){
    isRecording = false;
    micBtn.classList.remove('recording');
    micBtn.textContent = '🎤';
  }
};

  const jaTentou = localStorage.getItem('culinaria_indicacao_tentada');

  }
}

sendBtn.onclick = sendMessage;

/* Retorna apenas as últimas MAX_HISTORICO_TROCAS trocas (usuário+chef) da conversa,
   para controlar o custo de API em conversas longas. O histórico completo continua
   salvo e visível na tela — só o que é enviado para a API é reduzido.
   Garante que o array sempre comece com uma mensagem do usuário, como a API exige. */
function getMensagensParaAPI(){
  const limiteDeItens = MAX_HISTORICO_TROCAS * 2; // cada troca = 1 user + 1 assistant
  if(messages.length <= limiteDeItens) return messages;

  let cortado = messages.slice(-limiteDeItens);
  // se por algum motivo o corte começar com 'assistant', remove esse item solto
  if(cortado.length > 0 && cortado[0].role !== 'user'){
    cortado = cortado.slice(1);
  }
  return cortado;
}

async function sendMessage(){
  if(isSending || creditosBloqueado) return;
  const text = textInput.value.trim();
  if(!text && !pendingImage) return;

  if(exigeConfiguracao()) return;

  const userContentParts = [];
  if(pendingImage){
    userContentParts.push({
      type: 'image',
      source: { type: 'base64', media_type: pendingImage.mediaType, data: pendingImage.base64 }
    });
  }
  if(text){
    userContentParts.push({ type: 'text', text: text });
  } else {
    userContentParts.push({ type: 'text', text: '(enviei uma foto)' });
  }

  const imageForDisplay = pendingImage ? pendingImage.dataUrl : null;
  addUserBubble(text, imageForDisplay);

  messages.push({ role: 'user', content: userContentParts });
  saveMessages();

  textInput.value = '';
  autoResize();
  pendingImage = null;
  previewBar.classList.remove('show');
  cameraInput.value = '';
  galleryInput.value = '';

  isSending = true;
  sendBtn.disabled = true;
  const typingBubble = addAssistantBubble('', true);

  try{
    // 1. Desconta 1 crédito antes de chamar a IA
    const credito = await descontarCredito();

    if(credito.status === 'bloqueado' || credito.status === 'ultimo_credito_usado'){
      typingBubble.remove();
      mostrarBloqueio();
      isSending = false;
      return;
    }

    if(credito.aviso){
      mostrarAvisoSaldo(credito.aviso);
    }

    // 2. Chama a Edge Function do Supabase (sua chave fica segura no servidor,
    //    nunca exposta no navegador do cliente)
    const response = await fetch(`${SUPABASE_URL}/functions/v1/chat-anthropic`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        model: MODEL,
        max_tokens: 1500,
        system: SYSTEM_PROMPT,
        messages: getMensagensParaAPI()
      })
    });

    if(!response.ok){
      const errBody = await response.json().catch(()=>({}));
      throw new Error(errBody?.erro || `Erro ${response.status}`);
    }

    const data = await response.json();
    const textBlocks = data.content.filter(c => c.type === 'text').map(c => c.text);
    const fullText = textBlocks.join('\n');

    messages.push({ role: 'assistant', content: fullText });
    saveMessages();

    typingBubble.innerHTML = '';
    renderAssistantContent(typingBubble, fullText);
    scrollToBottom();

  }catch(err){
    typingBubble.innerHTML = '';
    typingBubble.style.color = '#a33';
    typingBubble.textContent = '⚠️ Deu um erro: ' + err.message;
  }finally{
    isSending = false;
    sendBtn.disabled = false;
  }
}

function saveMessages(){
  localStorage.setItem('culinaria_messages', JSON.stringify(messages));
}

/* ================= SETTINGS MODAL ================= */
openSettings.onclick = () => {
  document.getElementById('modalTitle').textContent = 'Configurações';
  document.getElementById('modalHint').textContent = 'Seu e-mail identifica sua conta e seus créditos, salvo só neste navegador.';
  emailInput.value = alunoEmail;
  settingsModal.classList.add('show');
  if(alunoEmail){ carregarMeuCodigoIndicacao(); }
};
settingsModal.onclick = (e) => {
  if(e.target === settingsModal){
    settingsModal.classList.remove('show');
    acaoPendente = null;
  }
};
saveKeyBtn.onclick = () => {
  alunoEmail = emailInput.value.trim().toLowerCase();
  localStorage.setItem('culinaria_email', alunoEmail);
  updateStatus();
  settingsModal.classList.remove('show');

  if(!alunoEmail) return;

  // Registra a indicação (se veio de um link de indicação) e carrega/gera o código próprio
  registrarIndicacaoSeNecessario();
  carregarMeuCodigoIndicacao();

  // Retoma automaticamente a ação que o usuário tentou fazer antes de configurar o e-mail
  if(acaoPendente){
    const acao = acaoPendente;
    acaoPendente = null;
    acao();
  } else if(chatEl.children.length === 0){
    // Garantia extra: nunca deixar a tela vazia
    renderAll();
  }
};
clearChatBtn.onclick = () => {
  if(confirm('Tem certeza que quer limpar toda a conversa?')){
    messages = [];
    localStorage.removeItem('culinaria_messages');
    renderAll();
    settingsModal.classList.remove('show');
  }
};
</script>
